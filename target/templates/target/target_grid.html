<style>
 #target-grid {
     text-align: center;
     line-height: 0;
     margin-top: 8px;
     margin-bottom: 20px;
     margin-left: auto;
     margin-right: auto;
 }
 .target-letter {
     display: inline-flex;
     align-items: center;
     justify-content: center;
     vertical-align: top;
     width: 72px;
     height: 72px;
     margin: 4px;
     font-size: 34px;
     font-weight: 700;
     line-height: 1;
     text-transform: uppercase;
     color: var(--gu-ink);
     background-color: var(--gu-white);
     border: 2px solid var(--gu-ink);
     cursor: pointer;
     user-select: none;
 }
 #target-l0 {
     color: var(--gu-white);
     background-color: var(--game);
     border-color: var(--game);
 }
 .target-teaser-description {
     text-align: center;
 }
 @media (max-width: 640px) {
     .target-letter {
         width: 64px;
         height: 64px;
         font-size: 30px;
     }
 }
</style>

<div id="target-grid">
    <span id="target-l1"
          class="target-letter target-unused-letter">{{object.letters.1}}
    </span><span id="target-l2"
                 class="target-letter target-unused-letter">{{object.letters.2}}
    </span><span id="target-l3"
                 class="target-letter target-unused-letter">{{object.letters.3}}
    </span><br />
    <span id="target-l4"
          class="target-letter target-unused-letter">{{object.letters.4}}
    </span><span id="target-l0"
                 class="target-letter target-unused-letter">{{object.letters.0}}
    </span><span id="target-l5"
                 class="target-letter target-unused-letter">{{object.letters.5}}
    </span><br /><span id="target-l6"
                       class="target-letter target-unused-letter">{{object.letters.6}}
    </span><span id="target-l7"
                 class="target-letter target-unused-letter">{{object.letters.7}}
    </span><span id="target-l8"
                 class="target-letter target-unused-letter">{{object.letters.8}}
    </span>
</div>
