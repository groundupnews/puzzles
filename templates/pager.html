{% if is_paginated %}
<nav class="gu-pager">
  {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">&lsaquo; Newer</a>{% else %}<span></span>{% endif %}
  <span class="gu-dateline">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">Older &rsaquo;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
