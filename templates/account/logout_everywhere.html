{% extends "base.html" %}
{% block title %}Sign out everywhere{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Sign out everywhere</h1>
  <p>Are you sure you want to sign out of all devices and sessions?</p>
  <form method="post" action="{% url 'logout_everywhere' %}">
    {% csrf_token %}
    <button type="submit">Sign out everywhere</button>
  </form>
</div>
{% endblock %}
